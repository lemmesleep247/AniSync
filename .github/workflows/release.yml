name: Build Signed Release

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (for example 1.0.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      # --------------------------------------------------
      # Checkout
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # --------------------------------------------------
      # Create tag when manually triggered
      # --------------------------------------------------
      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          # Validate version format
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"
            echo "Version must be in the format X.Y.Z"
            exit 1
          fi

          TAG="v${VERSION}"

          echo "Release tag: $TAG"

          # Check if tag already exists
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "$TAG"
          git push origin "$TAG"

      # --------------------------------------------------
      # Determine release tag
      # --------------------------------------------------
      - name: Set release tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=v${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      # --------------------------------------------------
      # Java
      # --------------------------------------------------
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # --------------------------------------------------
      # Gradle
      # --------------------------------------------------
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.13

      # --------------------------------------------------
      # Decode signing keystore
      # --------------------------------------------------
      - name: Decode Keystore
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: |
          echo "$SIGNING_KEY" | base64 -d > ./app/release.keystore

      # --------------------------------------------------
      # Build signed APKs
      # --------------------------------------------------
      - name: Build Release APKs
        env:
          KEYSTORE_FILE: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleStableRelease

      # --------------------------------------------------
      # Rename all APKs
      # --------------------------------------------------
      - name: Rename Release APKs
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/stable/release"

          echo "Generated APKs:"
          find "$APK_DIR" -type f -name "*.apk" -print

          APK_COUNT=0

          for APK in "$APK_DIR"/*.apk; do
            if [ ! -f "$APK" ]; then
              continue
            fi

            FILENAME=$(basename "$APK")

            # Determine ABI
            if [[ "$FILENAME" == *"universal"* ]]; then
              ABI="universal"
            elif [[ "$FILENAME" == *"arm64-v8a"* ]]; then
              ABI="arm64-v8a"
            elif [[ "$FILENAME" == *"armeabi-v7a"* ]]; then
              ABI="armeabi-v7a"
            elif [[ "$FILENAME" == *"x86_64"* ]]; then
              ABI="x86_64"
            elif [[ "$FILENAME" == *"x86"* ]]; then
              ABI="x86"
            else
              ABI="unknown"
            fi

            NEW_NAME="$APK_DIR/AniSync ${TAG} ${ABI}.apk"

            echo "Renaming:"
            echo "  $APK"
            echo "  -> $NEW_NAME"

            mv "$APK" "$NEW_NAME"

            APK_COUNT=$((APK_COUNT + 1))
          done

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "No APKs found!"
            exit 1
          fi

          echo ""
          echo "Final APKs:"
          find "$APK_DIR" -type f -name "*.apk" -print

      # --------------------------------------------------
      # Upload all APKs as workflow artifacts
      # --------------------------------------------------
      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AniSync-${{ steps.release_tag.outputs.tag }}
          path: app/build/outputs/apk/stable/release/*.apk
          if-no-files-found: error

      # --------------------------------------------------
      # Create GitHub Release
      # --------------------------------------------------
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: AniSync ${{ steps.release_tag.outputs.tag }}
          generate_release_notes: true
          files: app/build/outputs/apk/stable/release/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
